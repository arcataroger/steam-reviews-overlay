<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steam Reviews Overlay</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="hdr">
      <img src="../../public/icon48.png" alt="" width="20" height="20" />
      <span id="hdrTitle" data-i18n="extName">Steam Reviews Overlay</span>
      <span id="hdrVersion" class="hdr-version"></span>
      <button id="configToggle" class="icon-btn" type="button" aria-expanded="false" aria-controls="configView">
        <svg class="ico-gear" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.5a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.7 8.8a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.5c0 .2.2.4.5.4h3.8c.3 0 .5-.2.5-.4l.4-2.5a7.3 7.3 0 0 0 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        <svg class="ico-close" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="mainView">
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="sec panel-wrap">
      <div class="panel" aria-busy="true">
        <div class="readouts">
          <div class="readout left" id="readoutFilter">
            <div class="plate-row">
              <span class="plate-title" data-i18n="filter">FILTER</span>
            </div>
            <div class="switch" role="radiogroup" id="mode" data-i18n-aria="modeAria">
              <button type="button" data-mode="dim" role="radio" data-i18n="dim">Dim</button>
              <button type="button" data-mode="hide" role="radio" data-i18n="hide">Hide</button>
            </div>
            <span class="digits" id="pctFilter">0%</span>
            <span class="tier" id="tierFilter"></span>
          </div>
          <div class="readout right" id="readoutHighlight">
            <div class="plate-row">
              <span class="plate-title" data-i18n="highlight">HIGHLIGHT</span>
            </div>
            <span class="digits" id="pctHighlight">100%</span>
            <span class="tier" id="tierHighlight"></span>
          </div>
        </div>
        <div id="throttle" class="throttle">
          <div id="leverFilter" class="lever left" role="slider" tabindex="0" data-i18n-aria="leverFilterAria"
               aria-label="Filter bar"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="rail"><div class="fill" id="fillFilter"></div></div>
            <div class="detent bottom"><span data-i18n="off" aria-hidden="true">OFF</span></div>
            <div class="knob" id="knobFilter"><b class="arrow"></b><i></i><i></i><i></i></div>
          </div>
          <div id="notches" class="notches"></div>
          <div id="leverHighlight" class="lever right" role="slider" tabindex="0" data-i18n-aria="leverHighlightAria"
               aria-label="Highlight bar"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div class="rail"><div class="fill" id="fillHighlight"></div></div>
            <div class="detent top"><span data-i18n="off" aria-hidden="true">OFF</span></div>
            <div class="knob" id="knobHighlight"><i></i><i></i><i></i><b class="arrow"></b></div>
          </div>
        </div>
      </div>
    </section>

    </div>

    <div id="configView" class="config" hidden>
      <section class="cfg-sec">
        <h2 data-i18n="judgedBy">Judged by</h2>
        <div class="seg source-toggle" role="radiogroup" id="source" data-i18n-aria="sourceAria">
          <button type="button" data-source="local" role="radio"><span id="srcFlag">🏳️</span> <span data-i18n="myLanguage">My language</span></button>
          <button type="button" data-source="global" role="radio">🌐 <span data-i18n="allLanguages">All languages</span></button>
        </div>
        <p id="sourceHint" class="hint"></p>
      </section>
      <section class="cfg-sec">
        <h2 id="dimLabel" data-i18n="dim">Dim</h2>
        <div id="dimRow" class="hue-row">
          <input id="dimOpacity" class="hue dim-level" type="range" aria-labelledby="dimLabel" />
          <output id="dimValue" class="dim-value" for="dimOpacity"></output>
        </div>
        <p id="dimHint" class="hint" hidden></p>
      </section>
      <section class="cfg-sec">
        <h2 id="frameLabel" data-i18n="frameColor">Frame color</h2>
        <div class="hue-pick">
          <div id="frameSwatches" class="swatches" role="radiogroup" aria-labelledby="frameLabel"></div>
          <input id="frameHue" class="hue" type="range" step="1" data-i18n-aria="frameHue" />
          <div id="framePreview" class="frame-preview">
            <input id="frameHex" class="hex" type="text" maxlength="7" spellcheck="false"
                   autocomplete="off" data-i18n-aria="frameColor" />
            <div id="previewOrbit" class="sro-orbit" aria-hidden="true"></div>
          </div>
        </div>
        <label class="opt-check"><input id="sparkle" type="checkbox" /><span id="sparkleLabel"></span></label>
      </section>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
