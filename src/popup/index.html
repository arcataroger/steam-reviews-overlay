<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Steam Reviews Overlay</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="hdr">
      <img src="../../public/icon48.png" alt="" width="20" height="20" />
      <span>Steam Reviews Overlay</span>
    </header>

    <section class="sec panel-wrap">
      <div class="panel">
        <span class="screw tl"></span><span class="screw tr"></span>
        <span class="screw bl"></span><span class="screw br"></span>
        <div class="readouts">
          <div class="readout left" id="readoutFilter">
            <div class="plate-title">FILTER UNDER</div>
            <span class="digits" id="pctFilter">40%</span>
            <span class="tier" id="tierFilter"></span>
          </div>
          <div class="readout right" id="readoutHighlight">
            <div class="plate-title">HIGHLIGHT ABOVE</div>
            <span class="digits" id="pctHighlight">95%</span>
            <span class="tier" id="tierHighlight"></span>
          </div>
        </div>
        <div id="throttle" class="throttle">
          <div id="leverFilter" class="lever left" role="slider" tabindex="0"
               aria-label="Filter games under this positive-review percentage"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
            <div class="rail"><div class="fill" id="fillFilter"></div></div>
            <div class="knob" id="knobFilter"><i></i><i></i><i></i></div>
          </div>
          <div id="notches" class="notches"></div>
          <div id="leverHighlight" class="lever right" role="slider" tabindex="0"
               aria-label="Highlight games above this positive-review percentage"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="95">
            <div class="rail"><div class="fill" id="fillHighlight"></div></div>
            <div class="knob" id="knobHighlight"><i></i><i></i><i></i></div>
          </div>
        </div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title">Games under the left lever should be</div>
      <div class="seg" role="radiogroup" id="mode">
        <button type="button" data-mode="label" role="radio">Labeled</button>
        <button type="button" data-mode="dim" role="radio">Dimmed</button>
        <button type="button" data-mode="hide" role="radio">Hidden</button>
      </div>
      <p id="modeHelp" class="help"></p>
    </section>

    <section class="sec">
      <div class="sec-title">Games above the right lever should be</div>
      <div class="seg" role="radiogroup" id="highlight">
        <button type="button" data-highlight="off" role="radio">Left alone</button>
        <button type="button" data-highlight="border" role="radio">Outlined</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title">Judged by</div>
      <div class="seg" role="radiogroup" id="source">
        <button type="button" data-source="local" role="radio"><span id="srcFlag">🏳️</span> <span id="srcLang">My language</span></button>
        <button type="button" data-source="global" role="radio">🌐 All languages</button>
      </div>
    </section>

    <section class="sec">
      <label class="chk">
        <input id="includeUnreviewed" type="checkbox" />
        <span>Treat games with no reviews as below the bar</span>
      </label>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
