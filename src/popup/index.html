<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Steam Reviews Overlay</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="hdr">
      <img src="../../public/icon48.png" alt="" width="20" height="20" />
      <span data-i18n="extName">Steam Reviews Overlay</span>
    </header>
    <div id="status" class="status" hidden role="status"></div>

    <section class="sec panel-wrap">
      <div class="panel">
        <span class="screw tl"></span><span class="screw tr"></span>
        <span class="screw bl"></span><span class="screw br"></span>
        <div class="readouts">
          <div class="readout left" id="readoutFilter">
            <div class="plate-row">
              <span class="plate-title" data-i18n="filter">FILTER</span>
              <div class="switch" role="radiogroup" id="mode" data-i18n-aria="modeAria">
                <button type="button" data-mode="dim" role="radio" data-i18n="dim">Dim</button>
                <button type="button" data-mode="hide" role="radio" data-i18n="hide">Hide</button>
              </div>
            </div>
            <span class="digits" id="pctFilter">0%</span>
            <span class="tier" id="tierFilter"></span>
          </div>
          <div class="readout right" id="readoutHighlight">
            <div class="plate-row">
              <span class="plate-title" data-i18n="highlight">HIGHLIGHT</span>
            </div>
            <span class="digits" id="pctHighlight">100%</span>
            <span class="tier" id="tierHighlight"></span>
          </div>
        </div>
        <div id="throttle" class="throttle">
          <div id="leverFilter" class="lever left" role="slider" tabindex="0" data-i18n-aria="leverFilterAria"
               aria-label="Filter bar"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="rail"><div class="fill" id="fillFilter"></div></div>
            <div class="detent bottom"><span data-i18n="off">OFF</span></div>
            <div class="knob" id="knobFilter"><b class="arrow"></b><i></i><i></i><i></i></div>
          </div>
          <div id="notches" class="notches"></div>
          <div id="leverHighlight" class="lever right" role="slider" tabindex="0" data-i18n-aria="leverHighlightAria"
               aria-label="Highlight bar"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div class="rail"><div class="fill" id="fillHighlight"></div></div>
            <div class="detent top"><span data-i18n="off">OFF</span></div>
            <div class="knob" id="knobHighlight"><i></i><i></i><i></i><b class="arrow"></b></div>
          </div>
        </div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title" data-i18n="judgedBy">Judged by</div>
      <div class="seg" role="radiogroup" id="source" data-i18n-aria="sourceAria">
        <button type="button" data-source="local" role="radio"><span id="srcFlag">🏳️</span> <span class="two-line"><span data-i18n="myLanguage">My language</span><small id="srcLang"></small></span></button>
        <button type="button" data-source="global" role="radio">🌐 <span data-i18n="allLanguages">All languages</span></button>
      </div>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
