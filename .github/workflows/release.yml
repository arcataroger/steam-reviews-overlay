# Builds the extension for each version tag (v1.2.3) and publishes a GitHub Release with:
#   steam-reviews-overlay-chrome-<v>.zip   upload to the Chrome Web Store, or load unpacked
#   steam-reviews-overlay-firefox-<v>.xpi  unsigned; drag onto about:addons in Developer Edition, or upload to AMO
#   steam-reviews-overlay-source-<v>.zip   the source AMO's reviewers ask for (see BUILD.md)
# The notes come from .github/release-notes.md; add what changed by editing the release on GitHub.
# To release: bump "version" in package.json, commit, then `git tag v<version> && git push origin v<version>`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $v"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build and lint
        run: |
          npm run build:chrome
          npm run lint # builds dist/firefox, then runs Mozilla's web-ext lint on it

      - name: Package
        run: |
          mkdir release
          (cd dist/chrome && zip -qrX "../../release/steam-reviews-overlay-chrome-$VERSION.zip" . -x '.*' '*.map')
          (cd dist/firefox && zip -qrX "../../release/steam-reviews-overlay-firefox-$VERSION.xpi" . -x '.*' '*.map')
          git archive --format=zip -o "release/steam-reviews-overlay-source-$VERSION.zip" HEAD

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -e "s|{{VERSION}}|$VERSION|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" -e "s|{{TAG}}|$GITHUB_REF_NAME|g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
