<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Steam Reviews Overlay</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="hdr">
      <img src="../../public/icon48.png" alt="" width="20" height="20" />
      <span>Steam Reviews Overlay</span>
    </header>

    <section class="sec panel-wrap">
      <div class="panel">
        <span class="screw tl"></span><span class="screw tr"></span>
        <span class="screw bl"></span><span class="screw br"></span>
        <div class="readouts">
          <div class="readout left" id="readoutFilter">
            <div class="plate-row">
              <span class="plate-title">FILTER</span>
              <div class="switch" role="radiogroup" id="mode" aria-label="What to do with games under the left lever">
                <button type="button" data-mode="dim" role="radio">Dim</button>
                <button type="button" data-mode="hide" role="radio">Hide</button>
              </div>
            </div>
            <span class="digits" id="pctFilter">0%</span>
            <span class="tier" id="tierFilter"></span>
          </div>
          <div class="readout right" id="readoutHighlight">
            <div class="plate-row">
              <span class="plate-title">HIGHLIGHT</span>
            </div>
            <span class="digits" id="pctHighlight">100%</span>
            <span class="tier" id="tierHighlight"></span>
          </div>
        </div>
        <div id="throttle" class="throttle">
          <div id="leverFilter" class="lever left" role="slider" tabindex="0"
               aria-label="Filter games under this positive-review percentage"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="rail"><div class="fill" id="fillFilter"></div></div>
            <div class="detent bottom"><span>OFF</span></div>
            <div class="knob" id="knobFilter"><b class="arrow"></b><i></i><i></i><i></i></div>
          </div>
          <div id="notches" class="notches"></div>
          <div id="leverHighlight" class="lever right" role="slider" tabindex="0"
               aria-label="Highlight games above this positive-review percentage"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div class="rail"><div class="fill" id="fillHighlight"></div></div>
            <div class="detent top"><span>OFF</span></div>
            <div class="knob" id="knobHighlight"><i></i><i></i><i></i><b class="arrow"></b></div>
          </div>
        </div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title">Judged by</div>
      <div class="seg" role="radiogroup" id="source">
        <button type="button" data-source="local" role="radio"><span id="srcFlag">🏳️</span> <span class="two-line">My language<small id="srcLang"></small></span></button>
        <button type="button" data-source="global" role="radio">🌐 All languages</button>
      </div>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
